name: SwiftAssay CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v6
      - run: swift test
      - run: swift run swift-assay check Examples/Clean/Sources/Domain --json
      - run: '! swift run swift-assay check Examples/Violations/Sources/Domain'
